apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-result-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-result-app
  template:
    metadata:
      labels:
        app: student-result-app
    spec:
      containers:
        - name: student-result-app
          image: ghcr.io/mallangithanushreddy-2007/studentresultmanagementsystem:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: POSTGRES_URL
              value: "postgres://postgres:postgres_password@postgres-service:5432/student_db"
---
apiVersion: v1
kind: Service
metadata:
  name: student-result-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: student-result-app
